<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SelfPic Packages & Rates</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pricing-page">
      <div class="pricing-header">Self<span>Pic</span></div>
      <div class="hero">
        <div>
          <div class="pricing-intro">
            <h1>Our Packages</h1>
            <h4>Find session that's right for you</h4>
          </div>
          <div
            class="pricing-search"
            style="text-align: center; margin-top: 20px"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 4a7 7 0 1 1 0 14a7 7 0 0 1 0-14zm8 20l-4.35-4.35" />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Search for a package"
            />
          </div>
        </div>
        <div
          class="selection-categories"
          style="text-align: center; margin-top: 20px"
        >
          <!-- Desktop category buttons -->
          <div
            class="buttons d-none d-lg-flex justify-content-center gap-2 flex-wrap"
          >
            <button class="category-btn active" data-category="all">ALL</button>
            <button class="category-btn" data-category="selfPortrait">
              Self Portrait
            </button>
            <button class="category-btn" data-category="studioPortrait">
              Studio Portrait
            </button>
            <button class="category-btn" data-category="studioRental">
              Studio Rental
            </button>
          </div>
          <!-- Mobile category dropdown -->
          <div class="d-lg-none w-75 mx-auto" style="margin-top: 20px">
            <select
              class="form-select"
              id="categorySelect"
              aria-label="Select category"
            >
              <option value="all">ALL</option>
              <option value="selfPortrait">Self Portrait</option>
              <option value="studioPortrait">Studio Portrait</option>
              <option value="studioRental">Studio Rental</option>
            </select>
          </div>

          <div class="utility-actions" aria-label="Booking actions">
            <a
              class="utility-btn utility-btn-primary"
              href="#"
              aria-label="Message us for booking"
              id="bookingBtn"
            >
              Message Us for Booking
            </a>
            <a
              class="utility-btn utility-btn-secondary"
              href="#"
              aria-label="View location"
              id="locationBtn"
            >
              View Location
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="container-fluid mt-4 mb-4">
      <div class="cards-container" id="cardsContainer">
        <!-- Cards will be populated here -->
      </div>
      <div class="no-results" id="noResults" style="display: none">
        No packages found matching your search.
      </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
      <div
        class="modal-dialog modal-xl modal-dialog-centered modal-fullscreen-sm-down"
      >
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5>
          </div>
          <div class="modal-body">
            <div class="details-price" id="modalPrice"></div>
            <div class="detail-block">
              <h6>Package Includes:</h6>
              <ul id="modalFeatures"></ul>
            </div>
            <div id="modalAdditionalInfo" class="details-extra"></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary modal-close-btn"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Booking Important Modal -->
    <div class="modal fade" id="bookingImportantModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">IMPORTANT</h5>
          </div>
          <div class="modal-body">
            <div id="bookingImportantText" class="important-message"></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary modal-close-btn"
              data-bs-dismiss="modal"
            >
              Continue
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
