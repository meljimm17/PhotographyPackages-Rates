<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      .pricing-header {
        background-color: #262c38;
        color: white;
        white-space: nowrap;
        font-family: "Promo test", sans-serif;
        text-align: center;
        font-size: 24px;
      }
      .pricing-header span {
        color: #f8c722;
        font-family: "Promo test", sans-serif;
        text-align: center;
        font-size: 24px;
      }
      .pricing-intro {
        text-align: center;
        font-family: "Promo test", sans-serif;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="pricing-page">
      <div class="pricing-header">Self<span>Pic</span></div>

      <div class="pricing-intro">
        <h1>Our Packages</h1>
        <h4>Find session that's right for you</h4>
      </div>

      <div class="pricing-search" style="text-align: center; margin-top: 20px">
        <input type="text" placeholder="Search for a package" />
      </div>
    </div>

    <div
      class="pricing-categories"
      style="text-align: center; margin-top: 20px"
    >
      <!--desktop-->
      <div class="buttons d-none d-lg-flex justify-content-center gap-2">
        <button class="all">ALL</button>
        <button class="selfPortrait">Self Portrait</button>
        <button class="studioPortrait">Studio Portrait</button>
        <button class="studioRental">Studio Rental</button>
        <button class="addons">Add-ons</button>
      </div>

      <!--mobile-->
      <div class="d-lg-none">
        <select class="form-select" aria-label="Default select example">
          <option value="all">ALL</option>
          <option value="selfPortrait">Self Portrait</option>
          <option value="studioPortrait">Studio Portrait</option>
          <option value="studioRental">Studio Rental</option>
          <option value="addons">Add-ons</option>
        </select>
      </div>
    </div>

    <div
      class="container-fluid d-flex justify-content-center flex-wrap mt-4 mb-4 gap-3"
    >
      <div class="card" style="width: 18rem">
        <img
          src="https://www.shutterstock.com/image-photo/powerful-male-lion-stands-proudly-600nw-2630722023.jpg"
          class="card-img-top"
          alt="Lion"
        />
        <div class="card-body" style="width: 18rem">
          <h5 class="card-title" style="text-align: center">Lion</h5>
          <h1 class="card-price" style="text-align: center">$99.99</h1>
          <a href="viewDetails" class="btn btn-primary w-100 mt-auto"
            >View more details</a
          >
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <img
          src="https://www.shutterstock.com/image-photo/powerful-male-lion-stands-proudly-600nw-2630722023.jpg"
          class="card-img-top"
          alt="Lion"
        />
        <div class="card-body" style="width: 18rem">
          <h5 class="card-title" style="text-align: center">Lion</h5>
          <h1 class="card-price" style="text-align: center">$99.99</h1>
          <a href="viewDetails" class="btn btn-primary w-100 mt-auto"
            >View more details</a
          >
        </div>
      </div>
      <div class="card" style="width: 18rem">
        <img
          src="https://www.shutterstock.com/image-photo/powerful-male-lion-stands-proudly-600nw-2630722023.jpg"
          class="card-img-top"
          alt="Lion"
        />
        <div class="card-body" style="width: 18rem">
          <h5 class="card-title" style="text-align: center">Lion</h5>
          <h1 class="card-price" style="text-align: center">$99.99</h1>
          <a href="viewDetails" class="btn btn-primary w-100 mt-auto"
            >View more details</a
          >
        </div>
      </div>
      <div class="card" style="width: 18rem">
        <img
          src="https://www.shutterstock.com/image-photo/powerful-male-lion-stands-proudly-600nw-2630722023.jpg"
          class="card-img-top"
          alt="Lion"
        />
        <div class="card-body" style="width: 18rem">
          <h5 class="card-title" style="text-align: center">Lion</h5>
          <h1 class="card-price" style="text-align: center">$99.99</h1>
          <a href="viewDetails" class="btn btn-primary w-100 mt-auto"
            >View more details</a
          >
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
